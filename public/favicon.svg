<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Metallic Bezel Gradient Outer -->
    <linearGradient id="metalBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="15%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Metallic Bezel Inner Ring -->
    <linearGradient id="metalInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Blue Glow Filter -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Tooth Gradient -->
    <linearGradient id="toothMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Text Glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Ring -->
  <circle cx="256" cy="256" r="250" fill="#0b0f19" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Metallic Bezel -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#metalBezel)" stroke-width="24" />
  
  <!-- Inner Metallic Divider Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#metalInner)" stroke-width="6" />

  <!-- Inner Dark Field -->
  <circle cx="256" cy="256" r="218" fill="url(#bgGrad)" />

  <!-- Soft Blue Atmosphere Light behind Tooth -->
  <circle cx="256" cy="210" r="110" fill="#38bdf8" opacity="0.18" filter="url(#blueGlow)" />

  <!-- Glowing Blue Tooth Shadow Layer -->
  <path d="M256,120 C220,120 180,135 175,185 C170,230 185,285 208,315 C220,330 226,335 238,320 C246,310 250,305 256,305 C262,305 266,310 274,320 C286,335 292,330 304,315 C327,285 342,230 337,185 C332,135 292,120 256,120 Z"
        fill="none" stroke="#38bdf8" stroke-width="22" stroke-linejoin="round" opacity="0.8" filter="url(#blueGlow)" />

  <!-- Main Metallic Tooth Outline -->
  <path d="M256,120 C220,120 180,135 175,185 C170,230 185,285 208,315 C220,330 226,335 238,320 C246,310 250,305 256,305 C262,305 266,310 274,320 C286,335 292,330 304,315 C327,285 342,230 337,185 C332,135 292,120 256,120 Z"
        fill="none" stroke="url(#toothMetal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Circuit Microchip inside Tooth -->
  <g transform="translate(0, -10)">
    <!-- Central Chip Box -->
    <rect x="236" y="185" width="40" height="40" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="3" />
    <rect x="244" y="193" width="24" height="24" rx="4" fill="#38bdf8" opacity="0.8" />

    <!-- Top Traces -->
    <path d="M246,185 L246,165 M256,185 L256,160 M266,185 L266,165" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <circle cx="246" cy="162" r="3" fill="#60a5fa" />
    <circle cx="256" cy="157" r="3.5" fill="#93c5fd" />
    <circle cx="266" cy="162" r="3" fill="#60a5fa" />

    <!-- Bottom Traces -->
    <path d="M246,225 L246,245 M256,225 L256,252 M266,225 L266,245" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <circle cx="246" cy="248" r="3" fill="#60a5fa" />
    <circle cx="256" cy="255" r="3.5" fill="#93c5fd" />
    <circle cx="266" cy="248" r="3" fill="#60a5fa" />

    <!-- Left Traces -->
    <path d="M236,195 L215,195 M236,205 L210,205 M236,215 L215,215" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <circle cx="212" cy="195" r="3" fill="#60a5fa" />
    <circle cx="207" cy="205" r="3.5" fill="#93c5fd" />
    <circle cx="212" cy="215" r="3" fill="#60a5fa" />

    <!-- Right Traces -->
    <path d="M276,195 L297,195 M276,205 L302,205 M276,215 L297,215" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <circle cx="300" cy="195" r="3" fill="#60a5fa" />
    <circle cx="305" cy="205" r="3.5" fill="#93c5fd" />
    <circle cx="300" cy="215" r="3" fill="#60a5fa" />
  </g>

  <!-- Glowing CoreDentSys Text -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="36" 
        letter-spacing="1" 
        fill="#38bdf8" 
        filter="url(#textGlow)">CoreDentSys</text>

  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="36" 
        letter-spacing="1" 
        fill="#93c5fd">CoreDentSys</text>
</svg>
